apiVersion: apps/v1

kind: Deployment

metadata:
  name: sample-python-deployment
  namespace: development

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sample-python-app

  template:
    metadata:
      labels:
        app: sample-python-app

    spec:
      containers:
      - name: sample-python-container

        image: sample-python-app

        ports:
        - containerPort: 5000

        securityContext:
          privileged: false

        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"