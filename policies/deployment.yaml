apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-app
        image: rohith-python-app

        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"